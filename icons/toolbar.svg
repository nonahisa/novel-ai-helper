<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!--
    1.0.0 で切り替えるツールバー用のアイコン（manifest の action.default_icon）。
    統合小説執筆環境の共通アイコン（2026-10-18。紺の地に、生成り色のキーボードと万年筆、ペン先から伸びる緑の芽）から作る。
    `node scripts/icons.mjs docs/assets/icon-1.0.0` で、このフォルダーに toolbar16/24/32.png を作る。
    （npm run で渡すときの二重のハイフンは、SVG の注記の中に書けない。書くと SVG が壊れて読み込めなくなる）

    考え方は 0.12.2 のツールバー用（2026-09-23 の裁定）を引き継ぐ。
    ツールバーでは四角の中の絵が 10px ほどになり、ほかの拡張より小さく見えるので、四角を外し、絵を枠いっぱいに描く。
    manifest の icons（ストアや拡張機能の一覧に出る大きいアイコン）は、共通アイコンの四角のまま使う。

    ・構図は共通アイコンに合わせる：キーボードが下、ペンは先を左下へ向けて斜め、芽はペン先から上へ伸びて葉が左右に開く
    ・16px で1マスが1画素になるよう、キーボードの縁とキーは整数の位置に置く（半端だと滲む）
    ・ペンとキーボードの色は、共通アイコンの地の紺（#22263a）。紺は暗いツールバー（#35363a・#202124）に対して
      コントラスト比が 1.1〜1.2 しかなく沈むので、外側に1マスの生成り色（#f4f1e8、共通アイコンの絵の色）の縁を付ける。
      縁は全部の形のぶんを先に敷き、そのあとで塗る（形ごとに縁と塗りを重ねると、あとの形の縁が前の形の塗りに食い込む）
    ・キーは生成り色で塗る。穴として抜くと、暗いツールバーでは地の色に沈んで見えなくなる
    ・芽の緑は、共通アイコンの #6cc35a・#8fd96f・#5bb04f をそのまま使わず、1色の #3f9a3c にする。
      共通アイコンの緑は紺の地の上で映える明るさで、白いツールバーに対しては比が 1.7〜2.7 しかなく薄く見える。
      #3f9a3c は 明るい地（#ffffff 3.56・#f1f3f4 3.20）にも暗い地（#35363a 3.39・#202124 4.52）にも 3 を超える
      （図の見分けに求められる 3:1）ので、芽だけは縁を付けずに両方の地で見える。16px で3色に分けても見分けられないので1色にした
    ・芽の茎は根元を太く、先をすぼめて葉の付け根で消す（共通アイコンの 2026-10-18 の描き直しと同じ。先を四角く残すと葉の付け根から
      はみ出して見える）
    ・左の葉の先は、左上の角から離す（四角が無いことを test/icons.test.js が左上の三角で見張っている）
    ・ペンは細部（首の段差・ペン先の穴）を省き、ペン先と胴のあいだを生成り色の筋で分けるだけにする。
      16px では段差が1画素に満たず、潰れて汚れに見えるため
    ・ペン先とキーボードのあいだは空ける（触れると1つの塊に見える）
  -->
  <defs>
    <rect id="keyboard" x="1" y="10" width="14" height="5" rx="1"/>
    <g id="pen" transform="translate(6.2 8.6) rotate(-40)">
      <path d="M0 0 L2.4 -1.3 L3.1 -1.5 L3.1 1.5 L2.4 1.3 Z"/>
      <path d="M3.9 -1.6 L8.6 -1.6 A1.6 1.6 0 0 1 8.6 1.6 L3.9 1.6 Z"/>
    </g>
  </defs>
  <g fill="#f4f1e8" stroke="#f4f1e8" stroke-width="2" stroke-linejoin="round">
    <use href="#keyboard"/>
    <use href="#pen"/>
  </g>
  <g fill="#22263a">
    <use href="#keyboard"/>
    <use href="#pen"/>
  </g>
  <g fill="#f4f1e8">
    <rect x="3" y="11" width="2" height="1"/>
    <rect x="7" y="11" width="2" height="1"/>
    <rect x="11" y="11" width="2" height="1"/>
    <rect x="4" y="13" width="8" height="1"/>
  </g>
  <g fill="#3f9a3c">
    <!-- 茎：ペン先の左上から立ち上がり、先は葉の付け根ですぼまって消える -->
    <path d="M6.3 8.2 C5.8 7.3 5.45 6.3 5.4 5.2 L5.3 5.2 C4.95 6.4 5.0 7.4 5.4 8.6 Z"/>
    <!-- 左の葉 -->
    <path d="M5.3 6.0 C3.6 6.4 2.1 5.6 1.5 3.7 C3.4 3.5 4.9 4.4 5.3 6.0 Z"/>
    <!-- 右の葉 -->
    <path d="M5.4 5.5 C5.3 3.1 6.9 1.3 9.5 0.9 C9.5 3.2 7.8 5.2 5.4 5.5 Z"/>
  </g>
</svg>
