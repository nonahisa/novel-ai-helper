<meta charset="utf-8" />
<title>貼り込み係</title>
<link rel="stylesheet" href="popup.css" />

<main>
  <h1>貼り込み係</h1>

  <p class="lead">
    母艦（統合小説執筆環境）で「貼り込み係へ渡す形でコピー」をしてから、下のボタンを押してください。
  </p>

  <button id="fill" type="button">この画面に貼り込む</button>

  <p class="lead">
    カクヨムの作品管理・アクセス数の画面を開いているときは、下のボタンで読者の反応をコピーできます。
  </p>

  <button id="copyStats" type="button">この画面の読者の反応をコピーする</button>

  <p id="status" class="status" role="status"></p>

  <section class="rules">
    <h2>この拡張がしないこと</h2>
    <ul>
      <li>投稿ボタンは押しません（送信はご自分の手で）</li>
      <li>通信は一切しません</li>
      <li>ログイン画面では動きません</li>
      <li>本文や、ほかの方の作品は読みません（読むのは、ご自分の管理画面に出ている数だけ）</li>
    </ul>
  </section>
</main>
