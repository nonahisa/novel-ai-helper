<meta charset="utf-8" />
<title>貼り込み係</title>
<link rel="stylesheet" href="popup.css" />

<main>
  <!--
    版は見出しの右へ薄く出す（作者の依頼、2026-09-22）。
    入れ直したのに古いままで動いている、を開いた瞬間に見分けるため
    ——chrome://extensions のカードまで見に行かなくて済む。
    **字は書かない。** manifest.json の版を popup.js が入れる
  -->
  <h1>貼り込み係 <span id="version" class="version"></span></h1>

  <!--
    ボタンの下の1行は、**開いている画面を見てから** popup.js が入れる。
    ここに静的な説明文を書かない——同じことを二度言うと、食い違った日に画面が嘘をつく。
    ボタンは**隠さない**。使えない画面では押せなくして、理由を下の行に出す。
  -->
  <button id="fill" type="button">この画面に貼り込む</button>

  <p id="fillReason" class="lead reason"></p>

  <button id="copyStats" type="button">この画面の読者の反応をコピーする</button>

  <p id="statsReason" class="lead reason"></p>

  <p id="status" class="status" role="status"></p>

  <section class="rules">
    <h2>この拡張がしないこと</h2>
    <ul>
      <li>投稿ボタンは押しません（送信はご自分の手で）</li>
      <li>通信は一切しません</li>
      <li>ログイン画面では動きません</li>
      <li>本文や、ほかの方の作品は読みません（読むのは、ご自分の管理画面に出ている数だけ）</li>
    </ul>
  </section>
</main>

<!-- 表とロジックは、ページ側（content script）と同じファイルを読む（写しを作らない）。 -->
<script src="common/messages.js"></script>
<script src="common/envelope.js"></script>
<script src="common/match.js"></script>
<script src="content/sites.js"></script>
<script src="content/statsSites.js"></script>
<!-- 画面の見立ては表の2つより**あと**に読む（describePage が両方の表を使うため）。 -->
<script src="common/pageState.js"></script>
<script src="popup.js"></script>
