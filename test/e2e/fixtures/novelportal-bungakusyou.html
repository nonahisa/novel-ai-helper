<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>文学賞・公募一覧 | 見本</title>
</head>
<body>
<!--
  ノベルポータルの公募の一覧（https://creative-story.net/bungakusyou/）の見本。画面の自動テストが route で返す。
  本物の写しではなく、content/contestSites.js の novelportal の行（枠 .contest-card・名前 h3・リンク a[href]・
  見出し h2・「開催予定」の枠は読まない）が当てにしている形だけを置いた。賞の名前・締切はすべて架空。

  読める公募は2件（「開催予定」の枠は公募ではないので数えない）。
-->
<main>
  <h2>2026年11月締切</h2>
  <div class="wp-block-group contest-card">
    <div class="wp-block-group__inner-container">
      <h3 class="wp-block-heading"><a href="https://example.com/e2e-mizuumi">第1回 見本みずうみ文学賞</a></h3>
      <table><tr><td>締切：2026年11月30日（月）</td></tr><tr><td>字数：5,000〜10,000字</td></tr></table>
    </div>
  </div>
  <div class="wp-block-group contest-card">
    <div class="wp-block-group__inner-container">
      <h3 class="wp-block-heading">開催予定</h3>
      <table><tr><td>見本の冬の企画 2026年12月10日～</td></tr></table>
    </div>
  </div>
  <h2>地域限定公募</h2>
  <div class="wp-block-group contest-card">
    <div class="wp-block-group__inner-container">
      <h3 class="wp-block-heading">第2回 見本かわべ市民文芸賞</h3>
      <table><tr><td>締切：2026年12月1日（火）</td></tr></table>
    </div>
  </div>
</main>
</body>
</html>
