<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>画面テストの作品 - カクヨム</title>
</head>
<body>
<!--
  カクヨムの作品管理（https://kakuyomu.jp/my/works/{作品ID}）の見本。画面の自動テスト（test/e2e/）が、
  本物のサイトの代わりに Playwright の route で返す。**本物のページの写しではない**——ヘルパーの読み取り係が
  当てにしている要素の形だけを、最小限で並べたもの。題も数もすべて架空。

  形の出どころ：
  - 「読者からの反応」6欄と今日・今月の PV：content/statsSites.js の workMetrics・periodMetrics
    （数は data-ui-tooltip-label から読む。表示は省略形にしてある＝実機と同じく、表示から読むと外れる）
  - 日ごとの PV のグラフ：statsSites.js の dailyGraph（li.feedbackGraph-graph）
  - 話の表：statsSites.js の episodeTables.work。table.episodes が**2つ**あり、片方は PV の枡を持たない控え
    （設計書7.3。拾うと全話が二重になる）
  - 大見出しの行：content/chapterRead.js（「大見出し」の字で見分ける。実機の作りは未確認）
  - 作品名：statsSites.js の workTitle（作品の公開ページへのリンクの字）
  ログインの欄（パスワード）は置かない——置くと読み取り係が「ログイン画面」として降りる（common/guard.js）。
-->
<main>
  <h1><a href="/works/1177354054800000001">画面テストの作品</a></h1>

  <div class="summary-content">
    <ul>
      <li class="ui-tooltip" data-ui-tooltip-label="フォロワー数 1,234"><span>1,234</span></li>
      <li class="ui-tooltip" data-ui-tooltip-label="PV数 56,789"><span>56.7K</span></li>
    </ul>
    <span class="feedback-points ui-tooltip" data-ui-tooltip-label="★数 321">★321</span>
    <span class="feedback-comments ui-tooltip" data-ui-tooltip-label="レビュー人数 12">12</span>
    <span class="feedback-points ui-tooltip" data-ui-tooltip-label="応援数 4,567">4.5K</span>
    <span class="feedback-comments ui-tooltip" data-ui-tooltip-label="コメント数 89">89</span>
    <div class="ui-tooltip" data-ui-tooltip-label="今日 3 PV">今日 3 PV</div>
    <div class="ui-tooltip" data-ui-tooltip-label="今週 9 PV">今週 9 PV</div>
    <div class="ui-tooltip" data-ui-tooltip-label="今月 45 PV">今月 45 PV</div>
  </div>

  <ul class="feedbackGraph">
    <li class="feedbackGraph-graph ui-tooltip" data-ui-tooltip-label="2026年10月10日：7PV"></li>
    <li class="feedbackGraph-graph ui-tooltip" data-ui-tooltip-label="2026年10月11日：11PV"></li>
  </ul>

  <table class="episodes">
    <tr class="chapter"><td>公開</td><td>大見出し</td><td>第一章『見本の岬』</td></tr>
    <tr class="episode">
      <td class="episode-title"><a href="/my/works/1177354054800000001/episodes/1">１話　見本のはじまり</a></td>
      <td class="episode-date">2026年10月1日12:00 最終更新</td>
      <td class="episode-characterCount">3,000文字</td>
      <td class="episode-feedback-cheerCount">20</td>
      <td class="episode-feedback-cheerComment">2</td>
      <td class="episode-feedback-pv">1,200 PV</td>
    </tr>
    <tr class="episode">
      <td class="episode-title"><a href="/my/works/1177354054800000001/episodes/2">２話　見本のつづき</a></td>
      <td class="episode-date">2026年10月5日18:30 最終更新</td>
      <td class="episode-characterCount">3,100文字</td>
      <td class="episode-feedback-cheerCount">15</td>
      <td class="episode-feedback-cheerComment"></td>
      <td class="episode-feedback-pv">800 PV</td>
    </tr>
  </table>

  <!-- 控えの表（実機では題も数も空。PV の枡が無いので読み取り係は読まない） -->
  <table class="episodes">
    <tr class="episode">
      <td class="episode-title"></td>
      <td class="episode-characterCount"></td>
    </tr>
    <tr class="episode">
      <td class="episode-title"></td>
      <td class="episode-characterCount"></td>
    </tr>
  </table>
</main>
</body>
</html>
